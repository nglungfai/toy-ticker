name: Update Toy Ticker prices

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (after Cardmarket's overnight refresh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_prices.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Commit new prices
        run: |
          git config user.name "toy-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data og s
          git diff --cached --quiet || git commit -m "Prices for $(date -u +%F)"
          git push
