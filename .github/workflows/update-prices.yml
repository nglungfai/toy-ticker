name: Update card prices

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (after Cardmarket's overnight refresh)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - name: Commit new prices
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Prices for $(date -u +%F)"
          git push
