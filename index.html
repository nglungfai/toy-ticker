<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Meal Prices</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #fafaf7; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e6e5df;
    --accent: #d62300; --accent-soft: #fde9e4; --up: #1a7f37; --down: #c62828; --gold: #f2b705;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #9b9a94; --line: #2f2f2c;
      --accent: #ff6a4d; --accent-soft: #3a211b; --up: #4cc26a; --down: #ff6b6b; --gold: #f5c542;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --panel: #1e1e1c; --text: #ecebe6; --muted: #9b9a94; --line: #2f2f2c;
    --accent: #ff6a4d; --accent-soft: #3a211b; --up: #4cc26a; --down: #ff6b6b; --gold: #f5c542;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  nav.series { display: flex; gap: 8px; margin: 24px 0 8px; overflow-x: auto; padding-bottom: 4px; }
  nav.series a { flex: none; text-decoration: none; color: var(--text); background: var(--panel);
                 border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
  nav.series a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  nav.series .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
                    margin-left: 6px; opacity: .85; }
  .series-head { margin: 16px 0 16px; }
  .series-head h2 { margin: 0; font-size: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); }
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       cursor: pointer; user-select: none; white-space: nowrap; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.sel { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  .no { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  canvas.spark { width: 90px; height: 26px; display: block; margin-left: auto; }
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; margin-top: 20px; }
  .detail h2 { margin: 0 0 2px; font-size: 18px; }
  .detail .chart-box { position: relative; height: 300px; margin-top: 12px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  a { color: var(--accent); }
  .holo { color: var(--gold); font-size: 12px; }
  .cardcell { display: flex; align-items: center; gap: 10px; }
  .pic, .ph { flex: none; border-radius: 4px; aspect-ratio: 63 / 88; }
  .toys .pic, .toys .ph { aspect-ratio: 1 / 1; }
  .pic { object-fit: cover; background: var(--line); display: block; }
  .pic.sm, .ph.sm { width: 34px; }
  .pic.lg, .ph.lg { width: 100%; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        background: var(--bg); border: 1px dashed var(--line); color: var(--muted); font-size: 10px; text-align: center; }
  .ph.lg { font-size: 22px; font-weight: 600; padding: 8px; }
  .ph.lg small { font-size: 13px; font-weight: 400; }
  .ph .phnote { font-size: 11px; opacity: .8; }
  .ph.holo-tile { background: linear-gradient(135deg, var(--accent-soft), var(--bg) 45%, var(--accent-soft)); border-style: solid; }
  .detail-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
  .detail-main { min-width: 0; }
  .credit { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }
  @media (max-width: 640px) {
    .detail-grid { grid-template-columns: 1fr; }
    #dPic { max-width: 180px; margin: 0 auto; }
  }
  .banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px;
            padding: 10px 14px; margin-bottom: 12px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Happy Meal <span>eBay</span> price tracker</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <nav class="series" id="nav" aria-label="Happy Meal series"></nav>

  <div class="series-head">
    <h2 id="sTitle"></h2>
    <div class="meta" id="sMeta"></div>
  </div>

  <div class="banner" id="empty" hidden>No prices collected for this series yet. They appear after the next daily update.</div>
  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-k="name" id="thName">Item</th>
        <th data-k="price" class="num">Median ask</th>
        <th data-k="d1" class="num">1-day</th>
        <th data-k="d30" class="num">vs 30-day avg</th>
        <th data-k="low" class="num">Lowest ask</th>
        <th data-k="count" class="num">Listings</th>
        <th class="num">History</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <section class="detail" id="detail" hidden>
    <div class="detail-grid">
      <div id="dPic"></div>
      <div class="detail-main">
        <h2 id="dTitle"></h2>
        <div class="meta" id="dMeta"></div>
        <div class="chart-box"><canvas id="dChart"></canvas></div>
        <div class="note" id="dNote"></div>
      </div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let DATA, SID, sortKey = "price", sortDir = -1, selected = null, chart = null;

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const usd = (v) => v == null ? "—" : "$" + v.toFixed(2);
const mean = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const pct = (v) => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const cls = (v) => v == null || Math.abs(v) < 0.005 ? "flat" : v > 0 ? "up" : "down";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const series = () => DATA.sets[SID];
const isCards = () => series().kind === "cards";

function rowsFor(sid) {
  const cutoff = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  return Object.entries(DATA.cards)
    .filter(([, c]) => c.set === sid)
    .map(([id, c]) => {
      const h = DATA.history[id] || [];
      const last = h[h.length - 1] || {}, prev = h[h.length - 2];
      const price = last.median ?? null;
      const ref30 = mean(h.slice(0, -1).filter(p => p.date >= cutoff).map(p => p.median).filter(v => v != null));
      return {
        id, ...c, h, last, price, low: last.low ?? null, count: last.count ?? null,
        d1: price != null && prev?.median ? price / prev.median - 1 : null,
        d30: price != null && ref30 ? price / ref30 - 1 : null,
      };
    });
}

function renderNav() {
  const list = Object.entries(DATA.sets).sort((a, b) => a[1].order - b[1].order);
  $("nav").innerHTML = list.map(([id, s]) =>
    `<a href="?s=${id}" data-s="${id}" ${id === SID ? 'aria-current="page"' : ""}>${esc(s.name)}${s.current ? '<span class="tag">Now</span>' : ""}</a>`).join("");
  $("nav").querySelectorAll("a").forEach(a => a.onclick = (e) => {
    e.preventDefault(); history.pushState(null, "", a.getAttribute("href")); go(a.dataset.s);
  });
  const cur = $("nav").querySelector('[aria-current="page"]');
  if (cur) $("nav").scrollLeft = cur.offsetLeft - ($("nav").clientWidth - cur.offsetWidth) / 2;
}

function go(sid) {
  SID = DATA.sets[sid] ? sid : Object.entries(DATA.sets).sort((a, b) => a[1].order - b[1].order)[0][0];
  selected = null; $("detail").hidden = true;
  const s = series();
  document.title = `${s.name} · Happy Meal Prices`;
  document.body.classList.toggle("toys", s.kind === "toys");
  $("sTitle").textContent = s.name;
  $("sMeta").innerHTML = `${s.kind === "cards" ? "Cards" : "Toys"} · ${fmtDate(s.start)} – ${s.end ? fmtDate(s.end) : "now"}` +
    (s.current ? " · in restaurants now" : "") + (s.note ? `<br>${esc(s.note)}` : "");
  $("thName").textContent = s.kind === "cards" ? "Card" : "Toy";
  $("foot").innerHTML = `Prices are <b>asking prices</b> of active eBay US Buy It Now listings, collected daily with the eBay Browse API. ` +
    (s.kind === "cards" ? "Lots, graded slabs and multi-card listings are filtered out. " : "Lots, full sets and multi-toy listings are filtered out. ") +
    `Shown is the median of what's left; asking prices usually run above what items actually sell for. Photos are from eBay listings and link to them. Not financial advice.`;
  renderNav();
  render();
}

function render() {
  const rows = rowsFor(SID).sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });

  const priced = rows.filter(r => r.price != null);
  const total = priced.reduce((s, r) => s + r.price, 0);
  const top = priced.slice().sort((a, b) => b.price - a.price)[0];
  const mover = priced.filter(r => r.d30 != null).sort((a, b) => Math.abs(b.d30) - Math.abs(a.d30))[0];
  const days = Math.max(0, ...rows.map(r => r.h.length));
  const first = rows.map(r => r.h[0]?.date).filter(Boolean).sort()[0];
  $("stats").innerHTML = `
    <div class="stat"><small>Full set (median asks)</small><b>${priced.length ? usd(total) : "—"}</b><small>${priced.length} of ${rows.length} priced</small></div>
    <div class="stat"><small>Most valuable</small><b>${top ? usd(top.price) : "—"}</b><small>${top ? esc(top.name) : ""}</small></div>
    <div class="stat"><small>Biggest move vs 30-day avg</small><b class="${cls(mover?.d30)}">${mover ? pct(mover.d30) : "—"}</b><small>${mover ? esc(mover.name) : ""}</small></div>
    <div class="stat"><small>Days tracked</small><b>${days}</b><small>${first ? "since " + fmtDate(first) : "not started"}</small></div>`;
  $("empty").hidden = priced.length > 0;

  $("rows").innerHTML = rows.map(r => `
    <tr data-id="${r.id}" class="${r.id === selected ? "sel" : ""}">
      <td><div class="cardcell">${thumb(r, "sm")}<div><span class="no">#${esc(r.number)}</span>${esc(r.name)}${r.rarity === "Holo" ? ' <span class="holo" title="Holo">✦</span>' : ""}</div></div></td>
      <td class="num">${usd(r.price)}</td>
      <td class="num ${cls(r.d1)}">${pct(r.d1)}</td>
      <td class="num ${cls(r.d30)}">${pct(r.d30)}</td>
      <td class="num">${usd(r.low)}</td>
      <td class="num">${r.count ?? "—"}</td>
      <td class="num"><canvas class="spark" data-id="${r.id}"></canvas></td>
    </tr>`).join("");

  rows.forEach(r => spark(document.querySelector(`canvas.spark[data-id="${r.id}"]`), r));
  document.querySelectorAll("#rows tr").forEach(tr => tr.onclick = () => showDetail(tr.dataset.id));
  document.querySelectorAll("th[data-k]").forEach(th =>
    th.textContent = th.textContent.replace(/ [▲▼]$/, "") + (th.dataset.k === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : ""));
}

// Item photo, or a placeholder tile with the item number when there's no photo yet.
function thumb(r, size) {
  const holo = r.rarity === "Holo" ? " holo-tile" : "";
  const ph = `<div class="ph ${size}${holo}"><span>#${esc(r.number)}</span>${size === "lg" ? `<small>${esc(r.name)}</small><small class="phnote">Photo coming soon</small>` : ""}</div>`;
  if (!r.image) return ph;
  const img = `<img class="pic ${size}" src="${esc(r.image)}" alt="${esc(r.name)}" loading="lazy" referrerpolicy="no-referrer"
    onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">`;
  return size === "lg" && r.imageLink
    ? `<a href="${esc(r.imageLink)}" target="_blank" rel="noopener">${img}</a>` : img;
}

function spark(cv, r) {
  const dpr = window.devicePixelRatio || 1, w = 90, h = 26;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const pts = r.h.map(p => p.median).filter(v => v != null);
  if (pts.length < 2) return;
  const min = Math.min(...pts), max = Math.max(...pts), span = max - min || 1;
  ctx.strokeStyle = pts[pts.length - 1] >= pts[0] ? css("--up") : css("--down");
  ctx.lineWidth = 1.5; ctx.beginPath();
  pts.forEach((v, i) => {
    const x = 2 + (i / (pts.length - 1)) * (w - 4), y = h - 3 - ((v - min) / span) * (h - 6);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

function showDetail(id) {
  selected = id;
  const r = rowsFor(SID).find(x => x.id === id);
  $("detail").hidden = false;
  $("dTitle").textContent = `${r.name} #${r.number}`;
  $("dPic").innerHTML = thumb(r, "lg") +
    (r.image && r.imageCredit ? `<div class="credit">${r.imageLink ? `<a href="${esc(r.imageLink)}" target="_blank" rel="noopener">${esc(r.imageCredit)}</a>` : esc(r.imageCredit)}</div>` : "");
  const q = encodeURIComponent(`mcdonalds ${isCards() ? r.name + " " + r.number + "/015 2026" : series().name.replace(/[×()]/g, " ") + " " + r.name.replace(/[×()]/g, " ")}`);
  $("dMeta").innerHTML = `${esc(series().name)} · median ask ${usd(r.price)} · 25th percentile ${usd(r.last.p25)} · ${r.count ?? 0} listings · ` +
    `<a href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank" rel="noopener">eBay sold listings</a>`;
  if (chart) chart.destroy();
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
  const line = (key, label, color, dash) => ({
    label, data: r.h.map(p => p[key] ?? null), borderColor: color, backgroundColor: color,
    borderDash: dash || [], tension: .25, pointRadius: r.h.length < 15 ? 3 : 0, spanGaps: true,
  });
  chart = new Chart($("dChart"), {
    type: "line",
    data: { labels: r.h.map(p => p.date), datasets: [
      line("median", "Median ask", css("--accent")),
      line("p25", "25th percentile ask", css("--gold")),
      line("low", "Lowest ask", css("--muted"), [4, 4]),
    ]},
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      scales: { y: { ticks: { callback: v => "$" + v } } },
      plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${usd(c.parsed.y)}` } } },
    },
  });
  $("dNote").textContent = !r.h.length ? "No prices collected yet."
    : r.h.length < 3 ? "Only a few days collected so far. The chart fills in as the daily job runs." : "";
  render();
  $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

fetch("data/prices.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    $("meta").textContent = `Daily eBay asking prices for McDonald's Happy Meal toys and cards · updated ${new Date(d.updated).toLocaleString()}`;
    document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
      sortDir = th.dataset.k === sortKey ? -sortDir : (th.dataset.k === "name" ? 1 : -1);
      sortKey = th.dataset.k; render();
    });
    window.onpopstate = () => go(new URLSearchParams(location.search).get("s"));
    go(new URLSearchParams(location.search).get("s"));
  })
  .catch(e => { $("meta").textContent = "Couldn't load data/prices.json: " + e.message; });
</script>
</body>
</html>
